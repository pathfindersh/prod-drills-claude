# Shared by all environments. image.digest = manifest digest verified identical to upstream (mirror-images run 45426379819).
image:
  repository: ghcr.io/pathfindersh/redis
  digest: sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
containerPort: 6379
service:
  port: 6379
  portName: tcp-redis
resources:
  requests:
    cpu: 70m
    memory: 200Mi
  limits:
    cpu: 125m
    memory: 256Mi
readinessProbe:
  type: tcpSocket
  periodSeconds: 5
livenessProbe:
  type: tcpSocket
  periodSeconds: 5
networkPolicy:
  allowedFrom:
  - cartservice
args:
- redis-server
- --appendonly
- 'yes'
persistence:
  enabled: true
  size: 1Gi
  mountPath: /data
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault
