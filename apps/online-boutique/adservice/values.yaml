# Shared by all environments. image.digest = manifest digest verified identical to upstream (mirror-images run 45426379819).
image:
  repository: ghcr.io/pathfindersh/adservice
  digest: sha256:7b26b5ea1a6472ca62b3c20c6f6ac12dd1fbcf18ba596a2c174982bcccdfc0c8
containerPort: 9555
service:
  port: 9555
  portName: grpc
resources:
  requests:
    cpu: 200m
    memory: 180Mi
  limits:
    cpu: 300m
    memory: 300Mi
readinessProbe:
  type: grpc
  initialDelaySeconds: 20
  periodSeconds: 15
livenessProbe:
  type: grpc
  initialDelaySeconds: 20
  periodSeconds: 15
networkPolicy:
  allowedFrom:
  - frontend
