# Shared by all environments. image.digest = manifest digest verified identical to upstream (mirror-images run 45426379819).
image:
  repository: ghcr.io/pathfindersh/recommendationservice
  digest: sha256:69291992f5511e9199d08c24a3ceb6470b39461933304fbdad1c7ddfc7358fd9
containerPort: 8080
env:
  PORT: 8080
  PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
  DISABLE_PROFILER: 1
service:
  port: 8080
  portName: grpc
resources:
  requests:
    cpu: 100m
    memory: 220Mi
  limits:
    cpu: 200m
    memory: 450Mi
readinessProbe:
  type: grpc
  periodSeconds: 5
livenessProbe:
  type: grpc
  periodSeconds: 5
networkPolicy:
  allowedFrom:
  - frontend
