# Used by BOTH the bootstrap `helm install` and the self-managing Argo Application,
# so the two can never disagree. Slim: no dex, no notifications, no ApplicationSet controller
# (App of Apps covers our needs; see phase doc).
global:
  domain: argocd.local
configs:
  params:
    server.insecure: true        # UI via kubectl port-forward over plain HTTP
  cm:
    # lab is single-tenant; keep the built-in admin user (password generated by Argo)
    admin.enabled: "true"
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
server:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
