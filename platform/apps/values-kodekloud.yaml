# KodeKloud playground (3 x t3.medium, 17 pods/node). Sizing lives in values.yaml.
# node-exporter off: frees 3 pod slots. Cost: no node CPU/memory/disk history in Prometheus
# (`kubectl top nodes` still works through metrics-server).
extraValueFiles:
  kube-prometheus-stack:
    - platform/values/kodekloud/kube-prometheus-stack.yaml
