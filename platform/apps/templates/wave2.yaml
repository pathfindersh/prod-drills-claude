# ---- Wave 2: entrance (Gateways, routes). Needs the Envoy Gateway CRDs; retries until they exist. ----
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: platform/gateway
    helm:
      valuesObject:
        {{- toYaml .Values.gateway | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
