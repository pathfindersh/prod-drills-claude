{{- /* ApplicationSet: one Application per (environment, service) in onlineBoutique.environments.
       Sources: (1) charts/microservice from this repo, (2) this repo as $values for the values files.
       Argo renders with `helm template` (no Helm release exists in the cluster).
       scripts/test-env.sh renders this same file for the ephemeral test environment. */ -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.onlineBoutique.name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          {{- range $env, $services := .Values.onlineBoutique.environments }}
          {{- range $services }}
          - { env: {{ $env }}, service: {{ . }} }
          {{- end }}
          {{- end }}
  template:
    metadata:
      name: {{`'{{ .service }}-{{ .env }}'`}}
      labels:
        app.kubernetes.io/part-of: online-boutique
        environment: {{`'{{ .env }}'`}}
      finalizers:   # removing an element (or the set) also removes its resources
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: {{ .Values.repoURL }}
          targetRevision: {{ .Values.revision }}
          path: charts/microservice
          helm:
            releaseName: {{`'{{ .service }}'`}}
            valueFiles:
              - {{`$values/apps/online-boutique/{{ .service }}/values.yaml`}}
              - {{`$values/apps/online-boutique/{{ .service }}/values-{{ .env }}.yaml`}}
        - repoURL: {{ .Values.repoURL }}
          targetRevision: {{ .Values.revision }}
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: {{`'shop-{{ .env }}'`}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
