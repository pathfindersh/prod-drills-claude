{{- if and .Values.networkPolicy.enabled .Values.service.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ms.fullname" . }}
  labels: {{ include "ms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "ms.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.networkPolicy.fromAnywhere }}
    - ports:
        - port: {{ .Values.containerPort }}
    {{- else if .Values.networkPolicy.allowedFrom }}
    - from:
        {{- range .Values.networkPolicy.allowedFrom }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.containerPort }}
    {{- else }}
    []
    {{- end }}
{{- end }}
